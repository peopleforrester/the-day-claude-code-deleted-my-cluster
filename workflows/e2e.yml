name: e2e

# Tier 3 of the tiered enforcement model — fires only on PR to main.
# Mirrors the e2e.yml referenced on slide 11 of the talk deck.
#
# This is a starter template. Replace the test command in the last
# step with your repo's e2e suite: integration / end-to-end tests that
# hit the actual surface (network, real services, real infrastructure).
# Until you do, the gate is red, because a gate that passes with no
# suite behind it gates nothing.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv python install

      - run: uv sync --locked --group dev

      - name: Run e2e tests
        run: |
          # Replace this command with your repo's e2e suite. Common shapes:
          #   uv run pytest tests/e2e/ -x -q
          #   npm run test:e2e
          #   ./scripts/e2e-test.sh
          #
          # There is no fallback on purpose. Any non-zero exit fails the
          # gate, including pytest's exit 5, "no tests collected".
          uv run pytest tests/e2e/ -q
