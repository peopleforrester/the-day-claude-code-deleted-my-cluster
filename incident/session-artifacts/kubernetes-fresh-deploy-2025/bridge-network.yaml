apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: bridge-network
  namespace: default
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "bridge-network",
    "plugins": [
      {
        "type": "bridge",
        "bridge": "br0",
        "vlan": 0,
        "ipam": {
          "type": "host-local",
          "subnet": "192.168.0.0/24",
          "rangeStart": "192.168.0.200",
          "rangeEnd": "192.168.0.250",
          "gateway": "192.168.0.1"
        }
      },
      {
        "type": "cilium-cni",
        "chaining-mode": "generic-veth"
      }
    ]
  }'