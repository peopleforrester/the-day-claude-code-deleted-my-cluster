# Simple NetworkAttachmentDefinition for Linux Bridge (no IPAM)
# This version lets the VM/pod handle its own IP configuration
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: bridge-network-simple
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "bridge-network-simple",
      "type": "bridge",
      "bridge": "br0",
      "ipam": {}
    }
