# MetalLB IP Address Pool Configuration
# Range: 192.168.0.210-192.168.0.250 (41 IPs for LoadBalancer services)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.210-192.168.0.250
---
# L2 Advertisement for the pool
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - default-pool
