# Test PVC for Longhorn Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fixed
  resources:
    requests:
      storage: 1Gi
---
# Test pod that uses the PVC
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-test-pod
  namespace: default
spec:
  containers:
  - name: test-container
    image: nginx:alpine
    volumeMounts:
    - name: test-volume
      mountPath: /data
    command: ["/bin/sh"]
    args: ["-c", "echo 'Longhorn test successful!' > /data/test.txt && nginx -g 'daemon off;'"]
  volumes:
  - name: test-volume
    persistentVolumeClaim:
      claimName: longhorn-test-pvc
