# ABOUTME: System configuration applied to all nodes
# ABOUTME: Kernel modules, sysctl, and system settings for Kubernetes

system_configuration:
  swap:
    status: disabled
    persistent: true
    fstab_modified: true

  kernel_modules:
    loaded:
      - overlay
      - br_netfilter
      - ip_vs
      - ip_vs_rr
      - ip_vs_wrr
      - ip_vs_sh
      - nf_conntrack
    config_file: /etc/modules-load.d/k8s.conf

  sysctl_parameters:
    net.bridge.bridge-nf-call-iptables: 1
    net.bridge.bridge-nf-call-ip6tables: 1
    net.ipv4.ip_forward: 1
    net.ipv4.conf.all.forwarding: 1
    net.ipv6.conf.all.forwarding: 1
    config_file: /etc/sysctl.d/k8s.conf

  time_synchronization:
    service: chrony
    status: enabled
    config: /etc/chrony/chrony.conf

  firewall:
    status: not_configured
    reason: "UFW not active on nodes"

  cgroup:
    version: v2
    driver: systemd
    filesystem: cgroup2fs

nodes_configured:
  - 192.168.0.100 (master1)
  - 192.168.0.101 (master2)
  - 192.168.0.102 (master3)
  - 192.168.0.103 (worker1)
  - 192.168.0.104 (worker2)
