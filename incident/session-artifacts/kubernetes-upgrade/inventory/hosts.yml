---
# Kubernetes Cluster Inventory
# Production cluster: 192.168.0.50-58
# Generated: 2025 Configuration

all:
  vars:
    # Global variables for all hosts
    ansible_user: root
    # ansible_ssh_private_key_file: "~/.ssh/k8s_cluster_key"  # Not needed - we have passwordless root access
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    
    # Kubernetes versions
    kubernetes_version_current: "1.31.10"
    kubernetes_version_target: "1.32.0"
    kubernetes_version_target_short: "1.32"
    
    # Cluster configuration
    cluster_name: "homelab-k8s"
    pod_network_cidr: "10.0.0.0/16"
    service_cidr: "10.96.0.0/12"
    cluster_dns: "10.96.0.10"
    
    # CNI Configuration
    cni_plugin: "cilium"
    cilium_version: "1.16.5"
    
    # Container runtime
    container_runtime: "containerd"
    containerd_version: "1.7.24"
    
    # Network configuration
    cluster_vip: "192.168.0.50"
    cluster_vip_port: 6443
    network_interface: "enx*"  # Pattern matching for USB ethernet adapters
    
    # Backup configuration
    backup_dir: "/backup/kubernetes"
    etcd_backup_dir: "/backup/etcd"
    backup_retention_days: 30
    
    # Feature flags
    enable_monitoring: true
    enable_backup: true
    enable_rollback: true
    dry_run: false
    force_upgrade: false
    
    # Timeouts and retries
    drain_timeout: 300
    drain_grace_period: 30
    upgrade_timeout: 1800
    health_check_retries: 10
    health_check_delay: 30
    
    # Notification settings
    slack_webhook_url: ""  # Set in group_vars/all.yml or vault
    email_notifications: false
    notification_email: ""
    
  children:
    control_plane:
      vars:
        node_type: "control-plane"
        node_role: "master"
        etcd_member: true
        
      hosts:
        k8s01:
          ansible_host: 192.168.0.50
          ansible_hostname: k8s01
          etcd_member_name: etcd-k8s01
          priority: 100  # Primary master
          node_labels:
            node-role.kubernetes.io/control-plane: ""
            node.kubernetes.io/exclude-from-external-load-balancers: ""
          
        k8s02:
          ansible_host: 192.168.0.51
          ansible_hostname: k8s02
          etcd_member_name: etcd-k8s02
          priority: 90   # Secondary master
          node_labels:
            node-role.kubernetes.io/control-plane: ""
            node.kubernetes.io/exclude-from-external-load-balancers: ""
          
        k8s03:
          ansible_host: 192.168.0.52
          ansible_hostname: k8s03
          etcd_member_name: etcd-k8s03
          priority: 80   # Tertiary master
          node_labels:
            node-role.kubernetes.io/control-plane: ""
            node.kubernetes.io/exclude-from-external-load-balancers: ""
    
    workers:
      vars:
        node_type: "worker"
        node_role: "worker"
        etcd_member: false
        
      hosts:
        k8s04:
          ansible_host: 192.168.0.53
          ansible_hostname: k8s04
          worker_type: "general"
          node_labels:
            node-role.kubernetes.io/worker: ""
            workload-type: "general"
          resources:
            cpu: 4
            memory: 16
            
        k8s05:
          ansible_host: 192.168.0.54
          ansible_hostname: k8s05
          worker_type: "general"
          node_labels:
            node-role.kubernetes.io/worker: ""
            workload-type: "general"
          resources:
            cpu: 4
            memory: 16
            
        k8s06:
          ansible_host: 192.168.0.55
          ansible_hostname: k8s06
          worker_type: "general"
          node_labels:
            node-role.kubernetes.io/worker: ""
            workload-type: "general"
          resources:
            cpu: 4
            memory: 8
            
        k8s07:
          ansible_host: 192.168.0.56
          ansible_hostname: k8s07
          worker_type: "compute"
          node_labels:
            node-role.kubernetes.io/worker: ""
            workload-type: "compute"
            gpu: "false"
          resources:
            cpu: 8
            memory: 16
            
        k8s08:
          ansible_host: 192.168.0.57
          ansible_hostname: k8s08
          worker_type: "storage"
          node_labels:
            node-role.kubernetes.io/worker: ""
            workload-type: "storage"
            storage.longhorn.io/node: "true"
          resources:
            cpu: 4
            memory: 16
            
        k8s09:
          ansible_host: 192.168.0.58
          ansible_hostname: k8s09
          worker_type: "compute"
          node_labels:
            node-role.kubernetes.io/worker: ""
            workload-type: "compute"
            kubevirt.io/schedulable: "true"
          resources:
            cpu: 12
            memory: 64
            
    # Specialized groups for targeted operations
    etcd:
      children:
        control_plane:
        
    primary_master:
      hosts:
        k8s01:
          
    secondary_masters:
      hosts:
        k8s02:
        k8s03:
        
    # Batch groups for rolling updates
    worker_batch_1:
      hosts:
        k8s04:
        k8s05:
        k8s06:
        
    worker_batch_2:
      hosts:
        k8s07:
        k8s08:
        k8s09:
        
    # Storage nodes (Longhorn)
    storage_nodes:
      hosts:
        k8s08:
        k8s09:
        
    # High-memory nodes
    high_memory_nodes:
      hosts:
        k8s09:
        
    # Nodes requiring special handling
    critical_workload_nodes:
      hosts:
        k8s08:  # Storage
        k8s09:  # KubeVirt VMs