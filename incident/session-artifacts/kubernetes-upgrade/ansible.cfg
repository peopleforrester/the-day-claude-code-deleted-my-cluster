# Production-Ready Ansible Configuration for Kubernetes Cluster Upgrade
# Version: 2025.01 - Optimized for K8s 1.31.10 to 1.32.x upgrade

[defaults]
# Inventory and paths
inventory = ./inventory/hosts.yml
roles_path = ./roles:./galaxy_roles
library = ./library
module_utils = ./module_utils
lookup_plugins = ./plugins/lookup
filter_plugins = ./plugins/filter
callback_plugins = ./plugins/callback
vars_plugins = ./plugins/vars

# Connection settings
remote_user = root
# private_key_file = ~/.ssh/ansible_k8s_ed25519  # Not needed - we have passwordless root access
host_key_checking = False
timeout = 30
remote_port = 22

# Performance optimizations
forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.ansible_facts
fact_caching_timeout = 3600
fact_caching_prefix = k8s_upgrade_

# Task execution
strategy = free
poll_interval = 15
async_poll_interval = 5
# gather_timeout = 30  # Deprecated - use module_defaults instead

# Output and logging
stdout_callback = yaml
callback_whitelist = timer,profile_tasks,profile_roles
display_skipped_hosts = False
display_args_to_stdout = False
log_path = ./logs/ansible-upgrade.log
no_log = False
verbosity = 1

# Diff and validation
always = True
diff_always = True
diff_max_lines = 100

# Error handling
any_errors_fatal = False
max_fail_percentage = 0
force_handlers = True
error_on_undefined_vars = True

# Retry configuration
retry_files_enabled = True
retry_files_save_path = ./.ansible-retry

# Python interpreter
interpreter_python = /usr/bin/python3

# Jinja2
jinja2_native = True

# Privilege escalation
become = False
become_method = sudo
become_user = root
become_ask_pass = False

# Vault
# vault_password_file = ~/.ansible_vault_pass  # Uncomment when using vault
vault_id_match = True

# Deprecation warnings
deprecation_warnings = True
command_warnings = True
system_warnings = True

[inventory]
enable_plugins = yaml,ini,script,auto
cache = True
cache_plugin = jsonfile
cache_timeout = 3600
cache_connection = ./.ansible_inventory_cache

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=600s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
retries = 3
scp_if_ssh = smart
transfer_method = smart

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[colors]
highlight = bright blue
verbose = blue
warn = yellow
error = red
debug = dark gray
ok = green
changed = yellow
unreachable = bright red
diff_add = green
diff_remove = red