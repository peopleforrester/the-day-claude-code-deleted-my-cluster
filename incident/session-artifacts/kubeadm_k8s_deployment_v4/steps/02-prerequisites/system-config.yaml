---
# System prerequisites configuration for Kubernetes
# Applied to all nodes on 2025-08-04

swap:
  status: disabled
  fstab_updated: true

kernel_modules:
  loaded:
    - overlay
    - br_netfilter
  persistent: /etc/modules-load.d/k8s.conf

sysctl_parameters:
  configured:
    net.bridge.bridge-nf-call-iptables: 1
    net.bridge.bridge-nf-call-ip6tables: 1
    net.ipv4.ip_forward: 1
  config_file: /etc/sysctl.d/k8s.conf

packages_installed:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

verification_status:
  all_nodes_configured: true
  swap_disabled: true
  modules_loaded: true
  sysctl_applied: true
