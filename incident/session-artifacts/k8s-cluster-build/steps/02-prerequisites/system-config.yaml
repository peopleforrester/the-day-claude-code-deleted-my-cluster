---
# System Prerequisites Configuration
# Applied to all nodes on 2025-08-04

kernel_modules:
  - name: overlay
    description: "Required for container filesystem layers"
    loaded: true
  - name: br_netfilter
    description: "Required for bridge netfilter support"
    loaded: true

sysctl_parameters:
  net.bridge.bridge-nf-call-iptables:
    value: 1
    description: "Enable iptables rules on bridged traffic"
  net.bridge.bridge-nf-call-ip6tables:
    value: 1
    description: "Enable ip6tables rules on bridged traffic"
  net.ipv4.ip_forward:
    value: 1
    description: "Enable IP forwarding for container networking"

swap_configuration:
  status: disabled
  fstab_modified: true
  description: "Swap disabled as required by Kubernetes"

configuration_files:
  - path: /etc/modules-load.d/k8s.conf
    purpose: "Load required kernel modules at boot"
    content: |
      overlay
      br_netfilter

  - path: /etc/sysctl.d/k8s.conf
    purpose: "Persistent sysctl settings for Kubernetes"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

nodes_configured:
  - hostname: master1
    ip: 192.168.0.100
    status: configured
  - hostname: master2
    ip: 192.168.0.101
    status: configured
  - hostname: master3
    ip: 192.168.0.102
    status: configured
  - hostname: worker1
    ip: 192.168.0.103
    status: configured
  - hostname: worker2
    ip: 192.168.0.104
    status: configured

verification_completed: true
all_nodes_ready: true
