[project]
name = "sreday-texas-2026"
version = "0.0.0"
description = "Venue-specific materials for the SREday Austin / Texas 2026 talk"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
e2e = [
    "yt-dlp==2026.10.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
