name: security-scan
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12.3136.0
        with:
          directory: .
          framework: kubernetes,terraform,helm,dockerfile,github_actions
          quiet: true
          output_format: sarif
          output_file_path: checkov.sarif
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on the PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kube-linter:
    name: kube-linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: k8s
          format: sarif
          output-file: kube-linter.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: kube-linter.sarif
          category: kube-linter

  kubesec:
    name: kubesec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: scan
        run: |
          set -euo pipefail
          V=2.14.2
          curl -sSL "https://github.com/controlplaneio/kubesec/releases/download/v${V}/kubesec_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubesec
          fail=0
          while IFS= read -r -d '' f; do
              score=$(kubesec scan "$f" | jq -r '.[0].score // 0')
              echo "$f : $score"
              [ "$score" -lt 0 ] && fail=1
          done < <(find k8s manifests charts -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 2>/dev/null)
          exit $fail
