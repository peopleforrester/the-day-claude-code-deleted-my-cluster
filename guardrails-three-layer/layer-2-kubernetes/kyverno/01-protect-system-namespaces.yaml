# Block DELETE/UPDATE of cluster-critical namespaces.
# This policy alone would have stopped the first `kubectl delete ns kube-system` of the incident.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-system-namespaces
spec:
  validationFailureAction: Audit   # flip to Enforce after one week of clean PolicyReports
  background: false
  rules:
    - name: block-delete-system-namespaces
      match:
        any:
          - resources:
              kinds: [Namespace]
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - kyverno
                - argocd
                - flux-system
                - cert-manager
                - ingress-nginx
                - monitoring
                - falco
                - gatekeeper-system
      exclude:
        any:
          - subjects:
              - kind: User
                name: break-glass-admin
      validate:
        message: "Deletion/mutation of protected namespace '{{ request.object.metadata.name || request.oldObject.metadata.name }}' is not allowed."
        deny:
          conditions:
            any:
              - key: "{{ request.operation || 'BACKGROUND' }}"
                operator: AnyIn
                value: [DELETE, UPDATE]
